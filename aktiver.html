<!doctype html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/forms.css"><title>Aktivér jeres tavle – VisuPlanner</title></head><body><header class="finder-header"><a href="/"><img src="/assets/brand/wordmark.png" alt="VisuPlanner"></a></header><main class="form-page"><section class="form-intro"><p class="eyebrow">SIDSTE TRIN</p><h1>Vælg jeres egne koder</h1><p>VisuPlanner-administratoren kan ikke se de koder, I vælger.</p></section><form id="activateForm" class="request-form"><h2 id="teamName">Kontrollerer invitationen…</h2><label>Personalekode <small>Mindst 8 tegn</small><input name="editorPassword" type="password" minlength="8" autocomplete="new-password" required></label><label>Gentag personalekode<input name="editorRepeat" type="password" minlength="8" autocomplete="new-password" required></label><label>Tavlekode <small>Mindst 6 tegn</small><input name="viewerPassword" type="password" minlength="6" inputmode="text" autocomplete="new-password" required></label><label>Gentag tavlekode<input name="viewerRepeat" type="password" minlength="6" autocomplete="new-password" required></label><p class="form-note">Koderne skal være forskellige. Linket kan kun bruges én gang.</p><p id="activateStatus" class="finder-message" aria-live="polite"></p><button type="submit">Aktivér tavlen</button></form></main><script src="/aktiver.js"></script></body></html>
